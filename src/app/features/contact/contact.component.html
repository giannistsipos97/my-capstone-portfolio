<section
  class="min-h-screen bg-slate-950 text-slate-200 flex items-center justify-center py-16"
>
  <div class="max-w-3xl w-full px-6">
    <div class="mb-8">
      <app-back-button />
    </div>

    <div class="mb-12">
      <h1 class="text-4xl sm:text-5xl font-bold text-white mb-6">
        Contact <span class="text-indigo-500">Information</span>
      </h1>
      <div class="h-1 w-24 bg-indigo-500 rounded"></div>
      <p class="mt-6 text-slate-400 text-lg max-w-xl">
        Below you will find my contact information. Feel free to reach out to me
        via phone, email, or connect with me on LinkedIn and GitHub.
      </p>
    </div>

    <div class="space-y-8 mt-12">
      @for (contact of contacts; track contact.label) {
        <div
          class="flex flex-col md:flex-row md:items-center gap-2 md:gap-6 group"
        >
          <div
            class="flex items-center gap-3 w-36 text-indigo-500 font-mono tracking-widest text-xl"
          >
            <i
              [class]="contact.icon + ' w-5 text-center text-lg'"
              aria-hidden="true"
            ></i>
            <span>{{ contact.label }}</span>
          </div>

          <a
            [href]="contact.url"
            [target]="contact.isExternal ? '_blank' : '_self'"
            [rel]="contact.isExternal ? 'noopener noreferrer' : null"
            class="text-2xl md:text-3xl font-medium text-slate-300 hover:text-white transition-colors"
          >
            {{ contact.value }}
          </a>
        </div>
      }
    </div>
  </div>
</section>
