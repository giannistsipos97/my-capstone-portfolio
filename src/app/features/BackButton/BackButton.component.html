<a
  [routerLink]="route"
  class="inline-flex items-center gap-2 px-4 py-2 bg-slate-900 border border-slate-800 rounded-lg text-slate-300 text-sm font-medium hover:text-white hover:border-indigo-500/50 hover:bg-slate-800/80 transition-all group"
>
  <i
    class="fa-solid fa-arrow-left text-slate-400 group-hover:text-indigo-400 group-hover:-translate-x-0.5 transition-transform"
    aria-hidden="true"
  ></i>
  <span>{{ label }}</span>
</a>
